name: icicles_composition
description: >-
  Timeline compositions of icicles animations: the composition model, pure
  edit operations, the .icproj project codec and the compositor that renders
  a composition into a single .anim animation.
version: 0.8.0
publish_to: "none"
repository: https://github.com/led-icicles/icicles_composition

environment:
  sdk: ^3.5.3

dependencies:
  collection: ^1.19.1
  equatable: ">=2.0.7 <4.0.0"
  icicles_animation_dart:
    git:
      url: git@github.com:led-icicles/icicles_animation_dart.git
      ref: v3.2.0
  icicles_generators:
    path: ../icicles_generators

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
